# Hand-picked Instagram posts (@spadeslums) for the homepage feed.
# Used during development and as the fallback if Behold is unavailable.
# Newest first. Instagram image URLs expire, so images are stored locally.
#
# Each entry needs:
#   id      - the code from the post's URL, e.g. .../p/Dde2c3yiKr3/ -> Dde2c3yiKr3
#   url     - the full link to the post
#   type    - "post" or "reel"
#   caption - a short line shown under the image; "[TBC]" until written
#   image   - optional, a path to a saved copy of the post image
#             e.g. ../../assets/images/instagram/Dde2c3yiKr3.jpg

- id: Dde2c3yiKr3
  url: https://www.instagram.com/p/Dde2c3yiKr3/
  type: post
  caption: '[TBC]'

