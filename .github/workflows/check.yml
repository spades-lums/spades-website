# Continuous Integration: GitHub runs this automatically on every pull request and
# on every push to `main`. If it fails, the red X on the pull request tells you the
# change would break the site — so do not merge until it is green.
#
# It runs exactly the same command you run locally: `npm run verify`.
name: check

on:
  pull_request:
  push:
    branches: [main]

# If you push again while a run is still going, cancel the old run — no point
# testing a version of the branch that no longer exists.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint, format, build
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository onto the machine running this job.
      - name: Check out the repository
        uses: actions/checkout@v5

      # 2. Install Node. The version is read from .nvmrc, so CI and your laptop
      #    always agree. `cache: npm` reuses downloaded packages between runs.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # 3. Install dependencies. `npm ci` (not `npm install`) installs exactly the
      #    versions recorded in package-lock.json and fails if the lockfile is out
      #    of date, which keeps CI reproducible.
      - name: Install dependencies
        run: npm ci

      # 4. astro check (types) + eslint (code problems) + prettier (formatting) + build.
      - name: Verify
        run: npm run verify
